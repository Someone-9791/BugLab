name: python-debug-env
version: 0.1.0
description: "BugLab - An RL environment where agents debug broken Python code. Dual reward system: test pass rate + static code analysis."
author: "BugLab Team"
tags:
  - python
  - code
  - debugging
  - education
  - dual-reward
  
entry_point: server.app:app
action_type: models.DebugAction
observation_type: models.DebugObservation
state_type: models.DebugState

tasks:
  - id: "fix_logic_bug"
    name: "Fix Logic Bugs"
    description: "Identify and correct logical errors in control flow (if/else, loops, conditionals)"
    grader: "test_logic_fix"
  - id: "fix_algorithm_bug"
    name: "Fix Algorithm Bugs"
    description: "Correct algorithmic errors in data processing and computation"
    grader: "test_algorithm_fix"
  - id: "optimize_and_fix"
    name: "Optimize Code and Fix"
    description: "Improve code efficiency, readability, and style while maintaining correctness"
    grader: "test_optimization"

requirements:
  - openenv-core>=0.2.0
  - fastapi>=0.100.0
  - uvicorn>=0.23.0
  - pydantic>=2.0.0
  - requests>=2.31.0
